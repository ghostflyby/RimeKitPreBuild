name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Build (release)
        run: swift build -c release --product RimeDeploy

      - name: Package artifact bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE="RimeDeploy-${GITHUB_REF_NAME}.artifactbundle"
          BIN_DIR=$(swift build -c release --product RimeDeploy --show-bin-path)
          mkdir -p "$BUNDLE/rime-deploy-macos-arm64/bin"
          cp "$BIN_DIR/RimeDeploy" "$BUNDLE/rime-deploy-macos-arm64/bin/RimeDeploy"
          cat > "$BUNDLE/info.json" <<EOF
          {
            "schemaVersion": "1.0",
            "artifacts": {
              "RimeDeploy": {
                "version": "$VERSION",
                "type": "executable",
                "variants": [
                  {
                    "path": "rime-deploy-macos-arm64/bin/RimeDeploy",
                    "supportedTriples": ["arm64-apple-macosx"]
                  }
                ]
              }
            }
          }
          EOF
          zip -qr "$BUNDLE.zip" "$BUNDLE"
          echo "BUNDLE_ZIP=$BUNDLE.zip" >> "$GITHUB_ENV"

      - name: Checksum
        run: shasum -a 256 "${{ env.BUNDLE_ZIP }}" > "${{ env.BUNDLE_ZIP }}.sha256"

      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "$BUNDLE_ZIP" "$BUNDLE_ZIP.sha256" \
            --verify-tag --generate-notes --title "${{ github.ref_name }}"
        # 一次性 create+upload:仓库规则集将 release 设为不可变,创建后无法
        # 再单独上传资产(上一版工作流在此处 422 失败的根因)。
